<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#18132b" />
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#34D399;#A78BFA;#38BDF8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#34D399">
        <animate attributeName="stop-color" values="#34D399;#A78BFA;#38BDF8;#34D399" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#A78BFA">
        <animate attributeName="stop-color" values="#A78BFA;#38BDF8;#34D399;#A78BFA" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Text Shimmer Gradient -->
    <linearGradient id="textShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#34D399;#C084FC;#38BDF8" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="70%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Golden Highlight Gradient for Name Accent -->
    <linearGradient id="goldShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F6D860" />
      <stop offset="50%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="borderGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 800;
        font-size: 44px;
        letter-spacing: 2.5px;
        fill: url(#textShimmer);
      }
      .super-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 4px;
        fill: #F59E0B;
      }
      .subtitle {
        font-family: 'Courier New', Courier, monospace, 'Fira Code';
        font-weight: 600;
        font-size: 18px;
        letter-spacing: 2px;
        fill: #38BDF8;
      }
      .sub-role {
        font-family: 'Courier New', Courier, monospace, 'Fira Code';
        font-size: 16px;
        font-weight: 500;
        fill: #E2E8F0;
        letter-spacing: 1.5px;
      }
      .tag {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 12.5px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      .grid-line {
        stroke: #1e293b;
        stroke-width: 0.8;
        stroke-dasharray: 4 4;
        opacity: 0.45;
      }
      .circuit-line {
        stroke: #38BDF8;
        stroke-width: 1.5;
        stroke-dasharray: 100 200;
        animation: dash 6s linear infinite;
        opacity: 0.6;
      }
      .circuit-line-green {
        stroke: #34D399;
        stroke-width: 1.5;
        stroke-dasharray: 80 160;
        animation: dash-rev 7s linear infinite;
        opacity: 0.55;
      }
      @keyframes dash {
        to { stroke-dashoffset: -300; }
      }
      @keyframes dash-rev {
        to { stroke-dashoffset: 300; }
      }
    </style>
  </defs>

  <!-- Background Box -->
  <rect x="10" y="10" width="1180" height="320" rx="20" ry="20" fill="url(#bgGrad)" />

  <!-- Animated Circuit & Process Flow Lines -->
  <line x1="80" y1="60" x2="360" y2="60" class="circuit-line" />
  <circle cx="80" cy="60" r="3.5" fill="#38BDF8" />
  <circle cx="360" cy="60" r="3.5" fill="#38BDF8" />

  <line x1="840" y1="280" x2="1120" y2="280" class="circuit-line-green" />
  <circle cx="840" cy="280" r="3.5" fill="#34D399" />
  <circle cx="1120" cy="280" r="3.5" fill="#34D399" />

  <!-- Grid Blueprint Lines -->
  <line x1="50" y1="105" x2="1150" y2="105" class="grid-line" />
  <line x1="50" y1="235" x2="1150" y2="235" class="grid-line" />
  <line x1="260" y1="20" x2="260" y2="320" class="grid-line" />
  <line x1="940" y1="20" x2="940" y2="320" class="grid-line" />

  <!-- Systems Workflow Nodes -->
  <g opacity="0.65">
    <rect x="130" y="155" width="22" height="22" rx="5" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2" />
    <line x1="152" y1="166" x2="200" y2="166" stroke="#38BDF8" stroke-width="1" stroke-dasharray="2 2"/>
    <circle cx="206" cy="166" r="6" fill="#0F172A" stroke="#34D399" stroke-width="1.2" />
    
    <rect x="1030" y="140" width="22" height="22" rx="5" fill="#1E293B" stroke="#A78BFA" stroke-width="1.2" />
    <line x1="980" y1="151" x2="1030" y2="151" stroke="#A78BFA" stroke-width="1" stroke-dasharray="2 2"/>
    <circle cx="974" cy="151" r="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" />
  </g>

  <!-- Glowing Outer Frame Border -->
  <rect x="10" y="10" width="1180" height="320" rx="20" ry="20" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" filter="url(#borderGlow)" />

  <!-- Terminal Dot Indicators (Mac Style) -->
  <g transform="translate(45, 38)">
    <circle cx="0" cy="0" r="6" fill="#EF4444" opacity="0.85" />
    <circle cx="20" cy="0" r="6" fill="#F59E0B" opacity="0.85" />
    <circle cx="40" cy="0" r="6" fill="#10B981" opacity="0.85" />
    <text x="62" y="4" font-family="'Courier New', monospace" font-size="12" fill="#64748B">sys.env // business-systems-engineering-active</text>
  </g>

  <!-- Main Hero Content -->
  <g text-anchor="middle">
    <!-- Mini Pre-heading -->
    <text x="600" y="112" class="super-title">HELLO, I'M</text>

    <!-- Main Name Title -->
    <text x="600" y="155" class="title" filter="url(#glow)">MIHIRANGI DE SILVA</text>

    <!-- Subtitles -->
    <text x="600" y="194" class="subtitle">MANAGEMENT &amp; IT UNDERGRADUATE · UNIVERSITY OF KELANIYA</text>
    <text x="600" y="224" class="sub-role">✦ ASPIRING BUSINESS SYSTEMS ENGINEER &amp; BUSINESS ANALYST ✦</text>

    <!-- Domain Capability Badges -->
    <g transform="translate(600, 275)">
      <!-- Pill 1 -->
      <rect x="-380" y="-18" width="230" height="30" rx="15" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="-265" y="1" text-anchor="middle" class="tag" fill="#38BDF8">🏢 Enterprise Systems &amp; ERP</text>

      <!-- Pill 2 -->
      <rect x="-125" y="-18" width="250" height="30" rx="15" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="0" y="1" text-anchor="middle" class="tag" fill="#34D399">⚡ Process Analysis &amp; Agile SDLC</text>

      <!-- Pill 3 -->
      <rect x="150" y="-18" width="230" height="30" rx="15" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="265" y="1" text-anchor="middle" class="tag" fill="#A78BFA">💻 OOP Software &amp; MySQL</text>
    </g>
  </g>
</svg>
